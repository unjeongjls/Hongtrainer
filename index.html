<style>

:root{

  --ink:#12202A; --muted:#5A6872; --line:#D8DEE3; --tick:#B4BEC5;
  --accent:#0B7A6B; --accent-ink:#FFFFFF; --accent-soft:#DDF1ED;
  --warn:#B53D0C; --warn-soft:#FCE8DC; --scrim:rgba(8,16,22,.5);
  --f-disp:"Do Hyeon","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171C; --surface:#172229; --inset:#1D2B33;
    --ink:#E8EEF1; --muted:#93A3AD; --line:#2A3A44; --tick:#41545F;
    --accent:#3FC9B0; --accent-ink:#07201B; --accent-soft:#15352F;
    --warn:#FB9A6A; --warn-soft:#3A2418; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F171C; --surface:#172229; --inset:#1D2B33;
  --ink:#E8EEF1; --muted:#93A3AD; --line:#2A3A44; --tick:#41545F;
  --accent:#3FC9B0; --accent-ink:#07201B; --accent-soft:#15352F;
  --warn:#FB9A6A; --warn-soft:#3A2418; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px; font-variant-numeric:tabular-nums; word-break:keep-all; overflow-wrap:anywhere;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;flex:none}
.brand h1{font-family:var(--f-disp);font-weight:400;font-size:24px;letter-spacing:.01em;line-height:1}
.top time{font-size:13px;color:var(--muted)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{background:none;border:0;border-radius:10px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);font-weight:700}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500}

.btns .btn{flex:1;min-width:130px}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.hint{color:var(--muted);font-size:14px;padding:14px 2px}
.sec{margin-top:24px}

.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.sec-h h3{margin:0}
.sec-h.big h2{font-family:var(--f-disp);font-weight:400;font-size:26px;line-height:1.2}
.cnt{color:var(--muted);font-size:18px}

.hello .date{font-family:var(--f-disp);font-size:30px;line-height:1.2;margin-top:4px}

.tile.ok b{color:var(--accent)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}

input[type=search],input[type=text],input[type=date],input[type=time],input:not([type]),input[type=number],textarea,select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;line-height:1.5}
input,textarea{min-width:0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
#q{margin-bottom:10px}
.dateinp{width:auto;min-height:38px;padding:6px 10px;font-size:14px}

.mstrip{display:flex;gap:6px;overflow-x:auto;position:relative;padding:2px 0 10px;scrollbar-width:none}
.mstrip::-webkit-scrollbar{display:none}
.mt{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 14px;min-height:40px;font-weight:500;white-space:nowrap}
.mt i{font-style:normal;font-family:var(--f-disp);font-size:14px;background:var(--inset);color:var(--muted);border-radius:999px;min-width:28px;text-align:center;padding:2px 8px}
.mt.warn i{background:var(--warn-soft);color:var(--warn)}

.back{background:none;border:0;color:var(--muted);padding:2px 0 6px;min-height:32px;font-size:14px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-t{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

.rem-box{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

.rem-box .frac{color:var(--muted);font-size:13px;text-align:right}
.punch{display:flex;flex-wrap:wrap;gap:6px}
.pc{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--tick);display:block}
.pc.on{background:var(--accent);border-color:var(--accent)}
.pbar{height:10px;border-radius:6px;background:var(--inset);overflow:hidden;width:100%}
.pbar i{display:block;height:100%;background:var(--accent)}

.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--inset);border-radius:12px;padding:4px;margin:16px 0 6px}
.seg button{border:0;background:none;min-height:40px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13px;padding:0 2px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}

.month{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:18px 0 8px}

.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.tag.mute{background:var(--inset);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.vol{margin-left:auto;color:var(--muted);font-size:12px}
.exl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}

.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:12px}
.goal-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.goal-h h3{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.goal-t{font-size:17px;font-weight:700}
.goal-pct{display:flex;align-items:baseline;gap:6px}
.goal-pct b{font-family:var(--f-disp);font-weight:400;font-size:56px;line-height:.9;color:var(--accent)}

.gbar{height:12px;background:var(--inset);border-radius:7px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:7px}
.gnums{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.gnums b{color:var(--ink);font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-size:16px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}

.f2{display:grid;grid-template-columns:1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.si:first-child{border-top:0}
.si .tm{min-width:56px}
.si .mi{flex:1}
.meal-c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.meal-c dl{margin:8px 0 0;display:grid;grid-template-columns:44px 1fr;gap:4px 8px;font-size:14px}
.meal-c dt{color:var(--muted)}
.meal-c dd{margin:0;white-space:pre-wrap}
.meal-c .cm{margin-top:8px;border-radius:10px;background:var(--accent-soft);color:var(--ink);padding:8px 10px;font-size:14px;white-space:pre-wrap}
.rec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer}

.ch-t{fill:var(--muted);font-size:10px;font-family:var(--f-body)}

.empty{background:var(--surface);border:1px dashed var(--tick);border-radius:16px;padding:28px 20px;margin-top:12px;display:flex;flex-direction:column;gap:12px}

  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.panel{background:var(--bg);width:min(640px,100%);max-height:94%;display:flex;flex-direction:column;border-radius:18px 18px 0 0;overflow:hidden}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ex-h{display:flex;gap:8px}
.ex-name{font-weight:700}
.prev{font-size:12px;color:var(--accent)}

.sh{font-size:12px;color:var(--muted);padding-bottom:2px}
.sn{font-family:var(--f-disp);font-size:18px;color:var(--muted);text-align:center}

.sets{display:flex;flex-direction:column;gap:6px}
.inline{display:flex;gap:8px}

.check small{color:var(--muted)}

.pl li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.pl li:first-child{border-top:0}
.pl .pos{color:var(--accent);font-weight:700}

.scan{display:flex;flex-direction:column;gap:8px}
.pv{width:100%;max-height:220px;object-fit:contain;border-radius:12px;background:var(--inset)}

</style>

<script>
(function(){
'use strict';

/* ---------- 상수 · 상태 ---------- */
const COMMON=['스쿼트','데드리프트','벤치프레스','레그프레스','랫풀다운','시티드 로우','숄더프레스','런지','힙쓰러스트','레그 익스텐션','레그 컬','덤벨 컬','풀업','플랭크'];
const KEYS={member:'members',log:'logs',meal:'meals',body:'body',sched:'scheds'};
const LKEY='tsj-journal-v2';
const DOW=['일','월','화','수','목','금','토'];
const GOALS={weight:{n:'체중',u:'kg'},fat:{n:'체지방률',u:'%'},muscle:{n:'골격근량',u:'kg'}};
const BODYF=[['weight','체중','kg'],['muscle','골격근량','kg'],['fatMass','체지방량','kg'],['fat','체지방률','%'],['bmi','BMI',''],['bmr','기초대사량','kcal'],['score','인바디 점수','점'],['visceral','내장지방 레벨','']];
const S={members:{},logs:{},meals:{},body:{},scheds:{},mode:'pending',loading:true,slow:false,
  route:{view:'home'},routeKey:'home',tab:'overview',q:'',filter:'all',mealDate:'',bodyMetric:'weight',confirm:null};
const SC={sample:null,limits:null};
let col=null,lastSnap=null,pendingRender=false,slowTimer=null;

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ds(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ds(d)};
const daysAgo=n=>addDays(todayStr(),-n);
const parseD=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)};
const fmtDate=s=>{const d=parseD(s);return (d.getMonth()+1)+'/'+d.getDate()+' ('+DOW[d.getDay()]+')'};
const fmtLong=s=>{const d=parseD(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:''};
const fmtN=n=>Number(n).toLocaleString('ko-KR');
const has=x=>x!==''&&x!=null;
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},3600)}

/* ---------- 저장소 ---------- */
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LKEY)||'null');if(r){Object.keys(KEYS).forEach(t=>{S[KEYS[t]]=r[KEYS[t]]||{}})}}catch(e){}}
function saveLocal(){try{const o={};Object.keys(KEYS).forEach(t=>{o[KEYS[t]]=S[KEYS[t]]});localStorage.setItem(LKEY,JSON.stringify(o))}catch(e){}}
function applyDocs(snap){
  const n={members:{},logs:{},meals:{},body:{},scheds:{}};
  snap.docs.forEach(d=>{const x=d.data();const k=x&&KEYS[x.type];if(k)n[k][d.id]=x});
  Object.keys(n).forEach(k=>{S[k]=n[k]});
}
function writeFail(e){
  const c=e&&e.code;
  toast(c==='invalid_argument'?'저장 권한이 없어요. 공유 설정에서 편집 가능(Contributor 이상) 권한을 받아야 저장할 수 있어요.'
    :c==='quota_exceeded'?'저장 공간이 가득 찼어요.':'저장하지 못했어요. 잠시 후 다시 시도해 주세요.');
  if(lastSnap){applyDocs(lastSnap);render()}
}
function put(type,id,data){
  const rec=Object.assign({},data,{type:type});
  S[KEYS[type]][id]=rec;render();
  if(col){col.doc(id).set(rec).catch(writeFail)}else saveLocal();
}
function del(type,id){
  delete S[KEYS[type]][id];render();
  if(col){col.doc(id).delete().catch(writeFail)}else saveLocal();
}
async function initSample(){
  try{
    if(window.claude&&window.claude.use){
      const s=await window.claude.use('sample');
      if(s){SC.sample=s;try{SC.limits=await s.limits()}catch(e){}}
    }
  }catch(e){}
  render();
}
async function init(){
  initSample();
  let db=null,id=null;
  try{
    if(window.claude&&window.claude.use){
      const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=r[0];id=r[1]?await r[1].id():null;
    }
  }catch(e){}
  if(db&&id){
    S.mode='cloud';
    col=db.collection('data/users/'+id);
    slowTimer=setTimeout(()=>{S.slow=true;render()},10000);
    col.onSnapshot(snap=>{
      lastSnap=snap;applyDocs(snap);S.loading=false;
      if(!snap.metadata.fromCache){S.slow=false;clearTimeout(slowTimer)}
      render();
    },()=>{S.loading=false;S.slow=true;clearTimeout(slowTimer);render()});
  }else{
    S.mode='local';loadLocal();S.loading=false;render();
  }
}
const canScan=()=>!!(SC.sample&&SC.limits&&SC.limits.images);

/* ---------- 계산 ---------- */
function allLogs(){
  return Object.keys(S.logs).map(id=>Object.assign({id:id},S.logs[id]))
    .sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
}
function memberLogs(mid){return allLogs().filter(l=>l.memberId===mid)}
function allScheds(){
  return Object.keys(S.scheds).map(id=>Object.assign({id:id},S.scheds[id]))
    .sort((a,b)=>a.date.localeCompare(b.date)||String(a.time||'').localeCompare(String(b.time||'')));
}
function bodyList(mid){
  return Object.keys(S.body).map(k=>Object.assign({id:k},S.body[k])).filter(x=>x.memberId===mid).sort((a,b)=>a.date.localeCompare(b.date));
}
function passInfo(m,mid){
  const granted=(m.passes||[]).reduce((a,p)=>a+(Number(p.count)||0),0);
  const used=memberLogs(mid).filter(l=>l.counted).length;
  return {granted:granted,used:used,remaining:granted-used};
}
function status(p){
  if(p.granted<=0&&p.used===0)return 'none';
  if(p.remaining<=0)return 'ended';
  if(p.remaining<=3)return 'low';
  return 'active';
}
function statusCounts(){
  const c={all:0,active:0,low:0,ended:0,none:0};
  Object.keys(S.members).forEach(id=>{c.all++;c[status(passInfo(S.members[id],id))]++});
  return c;
}
function remainTxt(p){
  const st=status(p);
  if(st==='none')return {n:'—',sub:'수강권 없음',cls:'warn'};
  if(p.remaining<0)return {n:String(-p.remaining),sub:'회 초과',cls:'warn'};
  if(p.remaining===0)return {n:'0',sub:'회 · 종료',cls:'warn'};
  return {n:String(p.remaining),sub:'회 남음',cls:p.remaining<=3?'warn':''};
}
function goalProg(m,mid){
  if(!m.goalType||!GOALS[m.goalType]||!has(m.goalTarget))return null;
  const key=m.goalType,vals=bodyList(mid).filter(x=>has(x[key]));
  const start=has(m.goalStart)?Number(m.goalStart):(vals.length?Number(vals[0][key]):null);
  const cur=vals.length?Number(vals[vals.length-1][key]):null;
  const tgt=Number(m.goalTarget);
  if(start==null||cur==null)return {key:key,tgt:tgt,need:true};
  let pct=start===tgt?100:(cur-start)/(tgt-start)*100;
  pct=Math.max(0,Math.min(100,Math.round(pct)));
  return {key:key,start:start,cur:cur,tgt:tgt,pct:pct};
}
function fmtSets(sets){
  const s=(sets||[]).filter(x=>has(x.kg)||has(x.reps));
  if(!s.length)return '';
  const w=x=>(!has(x.kg)||Number(x.kg)===0)?'맨몸':x.kg+'kg';
  const r=x=>has(x.reps)?x.reps:'?';
  const same=s.length>1&&s.every(x=>x.kg===s[0].kg&&x.reps===s[0].reps);
  return same?w(s[0])+' × '+r(s[0])+'회 × '+s.length+'세트':s.map(x=>w(x)+'×'+r(x)).join(' · ');
}
function volume(l){
  let v=0;(l.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{if(has(s.kg)&&has(s.reps))v+=Number(s.kg)*Number(s.reps)}));
  return v;
}
const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
function prevOf(mid,name,date,selfId){
  if(!norm(name))return null;
  const logs=memberLogs(mid).filter(l=>l.id!==selfId&&l.date<=date);
  for(const l of logs){
    const e=(l.exercises||[]).find(x=>norm(x.name)===norm(name));
    if(e&&fmtSets(e.sets))return {date:l.date,txt:fmtSets(e.sets)};
  }
  return null;
}

/* ---------- 화면: 공통 ---------- */
const sec=(t,h)=>'<section class="sec"><h3>'+esc(t)+'</h3>'+h+'</section>';
function banner(){
  if(S.mode==='local')return '<p class="banner">이 브라우저에만 저장되고 있어요. 다른 기기나 브라우저에서는 보이지 않아요.</p>';
  if(S.slow)return '<p class="banner">저장소에 연결하는 중이에요. 보이는 내용이 최신이 아닐 수 있어요.</p>';
  return '';
}
function emptyStart(){
  return '<section class="empty"><h2>첫 회원을 등록해 보세요</h2>'+
    '<p>회원별로 수업 일정과 일지(종목·세트·무게), 식단, 목표 달성률, 인바디, 남은 수업 횟수를 한곳에서 관리해요.</p>'+
    '<div class="btns"><button type="button" class="btn primary" data-act="add-member">회원 추가</button>'+
    '<button type="button" class="btn" data-act="sample">예시 회원으로 둘러보기</button></div></section>';
}
function logRow(l,showDate){
  const m=S.members[l.memberId];if(!m)return '';
  const names=(l.exercises||[]).map(e=>e.name).filter(Boolean).join(', ')||'메모만 기록';
  const v=volume(l);
  return '<div class="row" role="button" tabindex="0" data-act="open-member" data-id="'+esc(l.memberId)+'" data-t="logs">'+
    '<div class="mi"><b>'+esc(m.name)+'</b><span class="sub">'+esc(names)+'</span></div>'+
    '<span class="when">'+(showDate?fmtDate(l.date):(v?fmtN(v)+'kg':''))+'</span></div>';
}

/* ---------- 화면: 대시보드 ---------- */
function viewHome(){
  const t=todayStr(),ids=Object.keys(S.members);
  if(!ids.length)return emptyStart();
  const c=statusCounts(),logs=allLogs();
  const todays=logs.filter(l=>l.date===t);
  const week=addDays(t,7);
  const sch=allScheds().filter(s=>S.members[s.memberId]&&s.date<=week);
  const low=ids.map(id=>({id:id,m:S.members[id],p:passInfo(S.members[id],id)}))
    .filter(x=>{const st=status(x.p);return st==='low'||st==='ended'||st==='none'}).sort((a,b)=>a.p.remaining-b.p.remaining);
  const recent=logs.filter(l=>l.date!==t).slice(0,5);
  const tile=(f,label,n,cls)=>'<button type="button" class="tile '+cls+'" data-act="tile" data-f="'+f+'"><span>'+label+'</span><b>'+n+'</b></button>';
  return '<section class="hello"><p class="date">'+fmtLong(t)+'</p>'+
    '<p class="sum">오늘 수업 <b>'+todays.length+'</b>회 · 오늘 예정 <b>'+sch.filter(s=>s.date===t).length+'</b>건</p></section>'+
    '<div class="tiles">'+tile('all','전체 등록',c.all,'')+tile('active','수업 중',c.active+c.low,'ok')+tile('low','곧 종료 (3회 이하)',c.low,c.low?'warn':'')+tile('ended','종료',c.ended,'')+'</div>'+
    '<button type="button" class="btn primary big" data-act="pick-log">수업 기록하기</button>'+
    sec('수업 일정 · 7일',sch.length?'<div class="list">'+sch.map(s=>{
      const over=s.date<t;
      return '<div class="row" role="button" tabindex="0" data-act="open-member" data-id="'+esc(s.memberId)+'" data-t="sched"><div class="mi"><b>'+esc(S.members[s.memberId].name)+'</b><span class="sub">'+(s.date===t?'오늘':fmtDate(s.date))+(s.memo?' · '+esc(s.memo):'')+'</span></div>'+
        (over?'<span class="tag warn">기록 필요</span>':'<span class="tm">'+esc(s.time||'')+'</span>')+'</div>';
    }).join('')+'</div>':'<p class="hint">예정된 수업이 없어요. 회원 화면의 일정 탭에서 추가해 주세요.</p>')+
    (low.length?sec('수강권 확인','<div class="list">'+low.map(x=>{
      const r=remainTxt(x.p);
      return '<div class="row" role="button" tabindex="0" data-act="open-member" data-id="'+esc(x.id)+'" data-t="overview"><div class="mi"><b>'+esc(x.m.name)+'</b><span class="sub">'+(x.p.granted<=0&&x.p.used===0?'수강권을 등록해 주세요':'총 '+x.p.granted+'회 중 '+x.p.used+'회 완료')+'</span></div>'+
        '<div class="rem '+r.cls+'"><b>'+r.n+'</b><small>'+r.sub+'</small></div></div>';
    }).join('')+'</div>'):'')+
    (todays.length?sec('오늘 수업','<div class="list">'+todays.map(l=>logRow(l,false)).join('')+'</div>'):'')+
    (recent.length?sec('최근 수업','<div class="list">'+recent.map(l=>logRow(l,true)).join('')+'</div>'):'');
}

/* ---------- 화면: 회원 목록 ---------- */
function viewMembers(){
  const n=Object.keys(S.members).length;
  if(!n)return emptyStart();
  const c=statusCounts();
  const F=[['all','전체',c.all],['active','수업 중',c.active+c.low],['low','곧 종료',c.low],['ended','종료',c.ended]];
  if(c.none)F.push(['none','수강권 없음',c.none]);
  return '<div class="sec-h big"><h2>회원 <span class="cnt">'+n+'</span></h2><button type="button" class="btn primary sm" data-act="add-member">+ 회원 추가</button></div>'+
    '<div class="chips scroll" style="margin-bottom:10px">'+F.map(f=>'<button type="button" class="chip'+(S.filter===f[0]?' on':'')+'" data-act="filter" data-f="'+f[0]+'">'+f[1]+' '+f[2]+'</button>').join('')+'</div>'+
    '<input id="q" type="search" placeholder="이름 검색" value="'+esc(S.q)+'" autocomplete="off"><div id="mlist">'+memberListHtml()+'</div>';
}
function memberListHtml(){
  const q=S.q.trim(),f=S.filter;
  const items=Object.keys(S.members).map(id=>({id:id,m:S.members[id],p:passInfo(S.members[id],id)}))
    .filter(x=>!q||String(x.m.name).includes(q))
    .filter(x=>{const st=status(x.p);return f==='all'||(f==='active'?(st==='active'||st==='low'):st===f)})
    .sort((a,b)=>f==='low'?a.p.remaining-b.p.remaining:String(a.m.name).localeCompare(String(b.m.name),'ko'));
  if(!items.length)return '<p class="hint">조건에 맞는 회원이 없어요.</p>';
  return '<div class="list">'+items.map(x=>{
    const r=remainTxt(x.p),last=memberLogs(x.id)[0],g=goalProg(x.m,x.id);
    return '<div class="row" role="button" tabindex="0" data-act="open-member" data-id="'+esc(x.id)+'" data-t="overview">'+
      '<div class="mi"><b>'+esc(x.m.name)+'</b><span class="sub">'+esc(x.m.goal||'목표 미입력')+(g&&g.pct!=null?' · 달성 '+g.pct+'%':'')+' · '+(last?'최근 수업 '+fmtDate(last.date):'수업 기록 없음')+'</span></div>'+
      '<div class="rem '+r.cls+'"><b>'+r.n+'</b><small>'+r.sub+'</small>'+(x.p.granted>0?'<span class="frac">'+x.p.used+'/'+x.p.granted+'</span>':'')+'</div></div>';
  }).join('')+'</div>';
}

/* ---------- 화면: 회원 상세 ---------- */
function punch(p){
  const cells=Math.max(p.granted,p.used);
  if(cells<=0)return '';
  if(cells>60)return '<div class="pbar" aria-hidden="true"><i style="width:'+Math.min(100,Math.round(p.used/cells*100))+'%"></i></div>';
  let h='';for(let i=0;i<cells;i++)h+='<i class="pc'+(i<p.used?' on':'')+'"></i>';
  return '<div class="punch" role="img" aria-label="총 '+cells+'회 중 '+p.used+'회 완료">'+h+'</div>';
}
function strip(cur){
  const ids=Object.keys(S.members).sort((a,b)=>String(S.members[a].name).localeCompare(String(S.members[b].name),'ko'));
  return '<div class="mstrip" id="mstrip" role="tablist" aria-label="회원">'+ids.map(id=>{
    const r=remainTxt(passInfo(S.members[id],id));
    return '<button type="button" role="tab" aria-selected="'+(id===cur)+'" class="mt'+(id===cur?' on':'')+(r.cls?' warn':'')+'" data-act="open-member" data-id="'+esc(id)+'" data-t="'+S.tab+'">'+esc(S.members[id].name)+'<i>'+r.n+'</i></button>';
  }).join('')+'</div>';
}
function viewMember(id){
  const m=S.members[id],p=passInfo(m,id),r=remainTxt(p);
  const tabs=[['overview','개요'],['sched','일정'],['logs','일지'],['meals','식단'],['body','인바디']];
  return strip(id)+'<button type="button" class="back" data-act="back">‹ 회원 목록</button>'+
    '<section class="hero"><div class="hero-t"><div><h2>'+esc(m.name)+'</h2><p class="sub">'+(m.start?'수업 시작 '+fmtDate(m.start):'수업 시작일 미입력')+'</p></div>'+
    '<button type="button" class="btn sm" data-act="edit-member">정보 수정</button></div>'+
    (m.note?'<p class="note">'+esc(m.note)+'</p>':'')+
    '<div class="rem-box"><div class="bigrem '+r.cls+'"><b>'+r.n+'</b><span>'+r.sub+'</span></div><div class="frac">'+p.used+'회 완료<br>총 '+p.granted+'회</div></div>'+
    punch(p)+
    '<div class="btns"><button type="button" class="btn" data-act="add-pass">수강권 변경</button><button type="button" class="btn primary" data-act="new-log">오늘 수업 기록</button></div></section>'+
    '<div class="seg" role="tablist">'+tabs.map(t=>'<button type="button" role="tab" aria-selected="'+(S.tab===t[0])+'" class="'+(S.tab===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+
    (S.tab==='overview'?tabOverview(id):S.tab==='sched'?tabSched(id):S.tab==='logs'?tabLogs(memberLogs(id)):S.tab==='meals'?tabMeals(id):tabBody(id));
}
function tabOverview(id){
  const m=S.members[id],g=goalProg(m,id),logs=memberLogs(id),t=todayStr();
  const next=allScheds().filter(s=>s.memberId===id&&s.date>=t)[0];
  const month=logs.filter(l=>l.date.slice(0,7)===t.slice(0,7)).length;
  let goalHtml;
  if(g&&g.pct!=null){
    const U=GOALS[g.key];
    const left=Math.abs(g.tgt-g.cur);
    goalHtml='<div class="goal-pct"><b>'+g.pct+'</b><span>% 달성</span></div><div class="gbar" role="img" aria-label="목표 달성률 '+g.pct+'%"><i style="width:'+g.pct+'%"></i></div>'+
      '<div class="gnums"><span>시작 <b>'+g.start+U.u+'</b></span><span>현재 <b>'+g.cur+U.u+'</b></span><span>목표 <b>'+g.tgt+U.u+'</b></span></div>'+
      '<p class="sub" style="white-space:normal">'+U.n+' '+(g.pct>=100?'목표를 달성했어요.':'목표까지 '+(Math.round(left*10)/10)+U.u+' 남았어요.')+'</p>';
  }else if(g&&g.need){
    goalHtml='<p class="hint" style="padding:0">'+GOALS[g.key].n+' 기록이 생기면 달성률을 계산해요. 인바디 탭에서 기록을 추가해 주세요.</p>';
  }else{
    goalHtml='<p class="hint" style="padding:0">목표 지표(체중, 체지방률, 골격근량)와 목표값을 정하면 달성률을 계산해요.</p>';
  }
  return '<section class="blk"><div class="goal-h"><h3>목표</h3><button type="button" class="btn sm" data-act="edit-member">'+(g?'수정':'목표 설정')+'</button></div>'+

function metricChart(list,key,label,unit,target){
  const pts=list.filter(x=>has(x[key]));
  if(pts.length<2)return '';
  const W=320,H=130,pl=34,pr=14,pt=24,pb=22;
  const ws=pts.map(p=>Number(p[key]));
  let lo=Math.min.apply(null,ws),hi=Math.max.apply(null,ws);
  if(has(target)){lo=Math.min(lo,Number(target));hi=Math.max(hi,Number(target))}
  if(hi-lo<1){lo-=.5;hi+=.5}
  const t0=parseD(pts[0].date).getTime(),t1=parseD(pts[pts.length-1].date).getTime();
  const X=d=>pl+(W-pl-pr)*((parseD(d).getTime()-t0)/(t1-t0||1));
  const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>(i?'L':'M')+X(p.date).toFixed(1)+' '+Y(Number(p[key])).toFixed(1)).join(' ');
  const area=line+' L'+X(pts[pts.length-1].date).toFixed(1)+' '+(H-pb)+' L'+X(pts[0].date).toFixed(1)+' '+(H-pb)+' Z';
  const last=pts[pts.length-1],lx=X(last.date),ly=Y(Number(last[key]));
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+' 변화 그래프">'+
    '<line class="ch-grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(hi)+'" y2="'+Y(hi)+'"/><line class="ch-grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(lo)+'" y2="'+Y(lo)+'"/>'+
    '<text class="ch-t" x="'+(pl-5)+'" y="'+(Y(hi)+3)+'" text-anchor="end">'+hi.toFixed(1)+'</text><text class="ch-t" x="'+(pl-5)+'" y="'+(Y(lo)+3)+'" text-anchor="end">'+lo.toFixed(1)+'</text>'+
    (has(target)?'<line class="ch-target" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(Number(target)).toFixed(1)+'" y2="'+Y(Number(target)).toFixed(1)+'"/><text class="ch-t" x="'+(pl+4)+'" y="'+(Y(Number(target))-4).toFixed(1)+'">목표 '+target+unit+'</text>':'')+
    '<path class="ch-area" d="'+area+'"/><path class="ch-line" d="'+line+'"/>'+
    pts.slice(0,-1).map(p=>'<circle class="ch-dot" cx="'+X(p.date).toFixed(1)+'" cy="'+Y(Number(p[key])).toFixed(1)+'" r="3"/>').join('')+
    '<circle class="ch-end" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4.5"/>'+
    '<text class="ch-v" x="'+lx.toFixed(1)+'" y="'+(ly-9).toFixed(1)+'" text-anchor="end">'+Number(last[key]).toFixed(1)+unit+'</text>'+
    '<text class="ch-t" x="'+pl+'" y="'+(H-6)+'">'+fmtDate(pts[0].date)+'</text><text class="ch-t" x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+fmtDate(last.date)+'</text></svg>';
}

/* ---------- 렌더 ---------- */
function typing(){
  const a=document.activeElement;
  return !!(a&&$('#app').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function render(){
  if(typing()){pendingRender=true;return}
  pendingRender=false;
  $('#today').textContent=fmtLong(todayStr());
  const r=S.route,app=$('#app');
  let h='';
  if(S.loading)h='<p class="hint">불러오는 중…</p>';
  else{
    h=banner();
    if(r.view==='member'&&S.members[r.id])h+=viewMember(r.id);
    else if(r.view==='members'||r.view==='member')h+=viewMembers();
    else h+=viewHome();
  }
  app.innerHTML=h;
  const st=$('#mstrip'),on=st&&st.querySelector('.mt.on');
  if(on)st.scrollLeft=on.offsetLeft-(st.clientWidth-on.clientWidth)/2;
  const cur=(r.view==='home')?'home':'members';
  document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',t.dataset.go===cur);if(t.dataset.go===cur)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
}
function setRoute(h){
  h=String(h||'').replace(/^#/,'');
  let key,r;
  if(h.indexOf('member-')===0){r={view:'member',id:h.slice(7)};key=h}
  else if(h==='members'){r={view:'members'};key='members'}
  else{r={view:'home'};key='home'}
  S.route=r;
  if(key!==S.routeKey){S.routeKey=key;S.tab='overview';S.mealDate=todayStr();S.confirm=null;window.scrollTo(0,0)}
  render();
}
function nav(h){
  setRoute(h);
  try{if(location.hash!=='#'+h)location.hash=h}catch(e){}
}

/* ---------- 바텀시트 ---------- */
const sh=$('#sheet'),shT=$('#sheet-t'),shB=$('#sheet-b'),shF=$('#sheet-f');
let shHandler=null,onClose=null;
function openSheet(title,body,foot,handler,focus,close){
  shT.textContent=title;shB.innerHTML=body;shF.innerHTML=foot||'';shF.hidden=!foot;
  shHandler=handler;onClose=close||null;sh.hidden=false;document.body.style.overflow='hidden';shB.scrollTop=0;
  if(focus){const f=shB.querySelector(focus);if(f)setTimeout(()=>f.focus(),30)}
}
function closeSheet(){
  const oc=onClose;onClose=null;
  sh.hidden=true;shHandler=null;shB.innerHTML='';document.body.style.overflow='';
  if(oc)oc();
  if(pendingRender)render();
}
sh.addEventListener('click',e=>{
  if(e.target===sh){closeSheet();return}
  const b=e.target.closest('[data-sa]');
  if(b&&shHandler)shHandler('click',b);
});
sh.addEventListener('input',e=>{if(shHandler)shHandler('input',e.target)});

function memberFoot(){

function memberHandler(kind,el){
  if(kind==='input')return;

  if(a==='cancel')return closeSheet();
  if(a==='pc'){$('#m-count').value=el.dataset.n;shB.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el));return}
  if(a==='del'){
    if(!M.delArm){M.delArm=true;shF.innerHTML=memberFoot();toast('회원의 일정·일지·식단·인바디 기록이 모두 삭제돼요. 한 번 더 누르면 삭제해요.');return}
    const id=M.id;
    Object.keys(S.logs).filter(k=>S.logs[k].memberId===id).forEach(k=>del('log',k));
    Object.keys(S.meals).filter(k=>S.meals[k].memberId===id).forEach(k=>del('meal',k));
    Object.keys(S.body).filter(k=>S.body[k].memberId===id).forEach(k=>del('body',k));
    Object.keys(S.scheds).filter(k=>S.scheds[k].memberId===id).forEach(k=>del('sched',k));
    del('member',id);closeSheet();nav('members');toast('회원을 삭제했어요');return;
  }
  if(a==='save'){

    const gt=$('#m-gtype').value;

      start:$('#m-start').value||todayStr(),note:$('#m-note').value.trim()};
    if(gt&&!has(base.goalTarget)){toast('목표값을 입력해 주세요');$('#m-gtarget').focus();return}
    if(M.id){put('member',M.id,Object.assign({},S.members[M.id],base));closeSheet();toast('회원 정보를 저장했어요')}

      const n=Number($('#m-count').value)||0,id='m-'+uid();
      put('member',id,Object.assign(base,{passes:n>0?[{date:todayStr(),count:n,note:'첫 등록'}]:[]}));
      closeSheet();nav('member-'+id);
    }
  }
}

function passHandler(kind,el){
  if(kind==='input'){
    if(el.id==='p-count')P.count=el.value;if(el.id==='p-note')P.note=el.value;if(el.id==='p-date')P.date=el.value||P.date;return;
  }

  if(a==='sign'){P.sign=Number(el.dataset.v);const y=shB.scrollTop;shB.innerHTML=passBody();shB.scrollTop=y;return}
  if(a==='pc'){P.count=el.dataset.n;$('#p-count').value=el.dataset.n;return}

    const m=S.members[P.mid],ps=(m.passes||[]).slice();ps.splice(Number(el.dataset.i),1);
    put('member',P.mid,Object.assign({},m,{passes:ps}));shB.innerHTML=passBody();toast('내역을 삭제했어요');return;
  }
  if(a==='save'){

function logHandler(kind,el){

  }
  const a=el.dataset.sa;

  if(a==='add-ex'||a==='add-ex-custom'){
    const name=a==='add-ex'?el.dataset.v:($('#l-newex').value||'').trim();

  if(a==='add-set'){const ex=L.exercises[Number(el.dataset.i)],last=ex.sets[ex.sets.length-1];ex.sets.push(last?{kg:last.kg,reps:last.reps}:{kg:'',reps:''});reLog();return}

/* ----- 인바디 기록 (사진 스캔 · 직접 입력) ----- */
let R=null;
const SCAN_PROMPT='이 이미지는 인바디(InBody) 체성분 분석 결과지 사진입니다. 결과지에 인쇄된 값을 읽어 JSON 객체 하나로만 답하세요. 키는 다음과 같습니다: '+
  'date(측정 일시의 날짜, YYYY-MM-DD 형식 문자열), weight(체중 kg), muscle(골격근량 kg), fatMass(체지방량 kg), fat(체지방률 %), bmi(BMI), bmr(기초대사량 kcal), score(인바디 점수), visceral(내장지방 레벨). '+
  '숫자는 단위 없이 JSON number로 쓰고, 결과지에 없거나 읽을 수 없는 값은 null로 쓰세요. 값을 추측해서 채우지 마세요. 이미지가 인바디 결과지가 아니면 {"error":"not_inbody"} 만 답하세요. 예: {"date":"2026-11-05","weight":61.1,"muscle":24.6,"fatMass":16.1,"fat":26.4,"bmi":22.3,"bmr":1280,"score":74,"visceral":6}';
function bodyBody(){
  const scan=canScan()?'<div class="scan">'+
    (R.preview?'<img class="pv" src="'+R.preview+'" alt="올린 인바디 사진">':'')+
    (R.scanning?'<div class="st"><span class="spin"></span><span>인바디 결과지를 읽는 중이에요. 보통 10~30초 걸려요.</span><button type="button" class="btn sm" data-sa="stop">중지</button></div>':'')+
    (R.err?'<div class="st err">'+esc(R.err)+'</div>':'')+
    (R.src==='scan'&&!R.scanning&&!R.err?'<div class="st">사진에서 읽은 값이에요. 숫자가 맞는지 확인하고 틀린 곳은 고쳐 주세요.</div>':'')+
    '<button type="button" class="btn" data-sa="pick-photo"'+(R.scanning?' disabled':'')+'>'+(R.preview?'다른 사진으로 다시 읽기':'인바디 사진 올려서 자동 입력')+'</button></div>':'';
  return scan+'<label class="fld"><span>측정일</span><input type="date" id="b-date" value="'+esc(R.date)+'"></label>'+
    '<div class="f3">'+BODYF.map(f=>'<label class="fld"><span>'+f[1]+(f[2]?' ('+f[2]+')':'')+'</span><input inputmode="decimal" data-bf="'+f[0]+'" value="'+esc(has(R.v[f[0]])?R.v[f[0]]:'')+'"></label>').join('')+'</div>';
}
function bodyFoot(){
  return (R.id?'<button type="button" class="btn danger" data-sa="del">'+(R.delArm?'정말 삭제':'삭제')+'</button>':'')+
    '<button type="button" class="btn" data-sa="cancel">취소</button><button type="button" class="btn primary grow" data-sa="save"'+(R.scanning?' disabled':'')+'>저장</button>';
}
function reBody(){
  if(!R||shHandler!==bodyHandler)return;
  const y=shB.scrollTop;shB.innerHTML=bodyBody();shF.innerHTML=bodyFoot();shB.scrollTop=y;
}
function openBodySheet(mid,rid){
  const b=rid&&S.body[rid];
  R={mid:mid,id:rid||null,date:b?b.date:todayStr(),v:{},src:b?(b.src||''):'manual',preview:'',scanning:false,err:'',ctl:null,delArm:false};
  if(b)BODYF.forEach(f=>{if(has(b[f[0]]))R.v[f[0]]=b[f[0]]});
  if(canScan()){try{$('#scan-file').accept=SC.limits.images.mediaTypes.join(',')}catch(e){}}
  openSheet(S.members[mid].name+' · 인바디',bodyBody(),bodyFoot(),bodyHandler,null,()=>{
    if(R&&R.ctl)R.ctl.abort();
    if(R&&R.preview){try{URL.revokeObjectURL(R.preview)}catch(e){}}
    R=null;
  });
}
function scanErr(c){
  return c==='not_granted'?'Claude 사용을 허용하지 않아 사진을 읽을 수 없어요. 값을 직접 입력해 주세요.'
    :c==='rate_limited'?'지금은 사용량 제한에 걸렸어요. 잠시 후 다시 시도하거나 직접 입력해 주세요.'
    :c==='image_rejected'?'이 사진은 읽을 수 없어요. 다른 사진을 선택해 주세요.'
    :c==='invalid_json'?'값을 정리하지 못했어요. 결과지가 잘 보이게 다시 찍어 올려 주세요.'
    :'사진을 읽지 못했어요. 다시 시도하거나 직접 입력해 주세요.';
}
async function runScan(file){
  const lim=SC.limits&&SC.limits.images;
  if(lim&&file.size>lim.maxInputBytes){R.err='사진 용량이 너무 커요. 더 작은 사진을 선택해 주세요.';reBody();return}
  if(R.preview){try{URL.revokeObjectURL(R.preview)}catch(e){}}
  try{R.preview=URL.createObjectURL(file)}catch(e){R.preview=''}
  const my=R,ctl=new AbortController();
  my.ctl=ctl;my.scanning=true;my.err='';reBody();
  try{
    const v=await SC.sample.json(SCAN_PROMPT,{images:file,signal:ctl.signal,cache:false});
    my.scanning=false;
    if(!v||typeof v!=='object'||v.error){my.err='인바디 결과지로 보이지 않아요. 결과지 전체가 보이도록 다시 찍어 올려 주세요.'}
    else{
      let n=0;
      BODYF.forEach(f=>{const x=num(v[f[0]]==null?'':v[f[0]]);if(x!==''){my.v[f[0]]=x;n++}});
      if(typeof v.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v.date))my.date=v.date;
      if(n){my.src='scan'}else{my.err='결과지에서 읽을 수 있는 값이 없었어요. 직접 입력해 주세요.'}
    }
  }catch(e){
    my.scanning=false;
    if(!e||e.code!=='cancelled')my.err=scanErr(e&&e.code);
  }
  my.ctl=null;
  if(R===my)reBody();
}
function bodyHandler(kind,el){
  if(kind==='input'){
    if(el.dataset.bf)R.v[el.dataset.bf]=num(el.value);
    else if(el.id==='b-date')R.date=el.value||R.date;
    return;
  }
  const a=el.dataset.sa;
  if(a==='cancel')return closeSheet();
  if(a==='stop'){if(R.ctl)R.ctl.abort();return}
  if(a==='pick-photo'){$('#scan-file').click();return}
  if(a==='del'){
    if(!R.delArm){R.delArm=true;shF.innerHTML=bodyFoot();toast('한 번 더 누르면 이 인바디 기록을 삭제해요.');return}
    del('body',R.id);closeSheet();toast('인바디 기록을 삭제했어요');return;
  }
  if(a==='save'){
    const vals={};let any=false;
    BODYF.forEach(f=>{const x=R.v[f[0]];vals[f[0]]=has(x)?x:'';if(has(x))any=true});
    if(!any){toast('값을 하나 이상 입력해 주세요');return}
    if(!R.date){toast('측정일을 입력해 주세요');return}
    const id='body-'+R.mid+'-'+R.date;
    if(S.body[id]&&R.id!==id&&!R.delArm&&!R.overwrite){R.overwrite=true;toast('같은 날짜의 기록이 이미 있어요. 한 번 더 누르면 덮어써요.');return}
    if(R.id&&R.id!==id)del('body',R.id);
    put('body',id,Object.assign({memberId:R.mid,date:R.date,src:R.src||'manual'},vals));
    closeSheet();toast('인바디 기록을 저장했어요');
  }
}

  mk(m1,5,'좋음',[{name:'스쿼트',sets:[{kg:45,reps:10},{kg:45,reps:10},{kg:45,reps:8},{kg:45,reps:8}]},{name:'랫풀다운',sets:set(30,12,3)},{name:'시티드 로우',sets:set(25,12,3)}],'스쿼트 중량 5kg 올림',2000);
  mk(m1,2,'피곤',[{name:'벤치프레스',sets:[{kg:20,reps:10},{kg:25,reps:8},{kg:25,reps:8}]},{name:'숄더프레스',sets:set(8,12,3)},{name:'덤벨 컬',sets:set(6,12,3)}],'수면 부족으로 볼륨 줄임',1000);
  put('meal','meal-'+m1+'-'+t(1),{memberId:m1,date:t(1),b:'오트밀 한 그릇, 삶은 달걀 2개',l:'닭가슴살 샐러드, 현미밥 반 공기',d:'두부김치, 밥 한 공기',s:'아메리카노, 바나나 1개',w:'1.5',c:'저녁 탄수화물은 좋아요. 단백질을 한 끼 더 챙겨 보세요.'});
  [[28,62.4,24.1,16.7,28.5,71],[14,61.8,24.3,16.0,27.6,73],[0,61.1,24.6,15.2,26.4,75]].forEach(r=>put('body','body-'+m1+'-'+t(r[0]),{memberId:m1,date:t(r[0]),src:r[0]===0?'scan':'manual',weight:r[1],muscle:r[2],fatMass:r[3],fat:r[4],score:r[5],bmi:22.3,bmr:1280,visceral:6}));
  [[0,'18:00','하체'],[2,'19:00','상체'],[5,'19:00','인바디 측정']].forEach(r=>put('sched','s-sample-'+uid()+r[0],{memberId:m1,date:addDays(todayStr(),r[0]),time:r[1],memo:r[2]}));
  put('member',m2,{name:'(예시) 이서준',goal:'근력 향상, 데드리프트 100kg',goalType:'',goalStart:'',goalTarget:'',start:t(40),note:'',passes:[{date:t(40),count:10,note:'PT 10회 등록'}]});
  for(let i=0;i<8;i++)mk(m2,38-i*4,'보통',[{name:'데드리프트',sets:set(60+i*3,5,4)},{name:'풀업',sets:set(0,4+(i%3),3)}],'',i*10);
  put('member',m3,{name:'(예시) 박지민',goal:'체력 증진',goalType:'',goalStart:'',goalTarget:'',start:t(70),note:'',passes:[{date:t(70),count:10,note:'PT 10회 등록'}]});
  for(let i=0;i<10;i++)mk(m3,66-i*6,'좋음',[{name:'런지',sets:set(8,12,3)},{name:'플랭크',sets:[{kg:0,reps:40},{kg:0,reps:40}]}],'',i*10);
  nav('member-'+m1);toast('예시 회원 3명을 추가했어요');
}

/* ---------- 이벤트 ---------- */
function curMember(){return S.route.view==='member'&&S.members[S.route.id]?S.route.id:null}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){nav(go.dataset.go);return}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const a=el.dataset.act,mid=curMember();
  if(a==='open-member'){
    const t=el.dataset.t||'overview',id=el.dataset.id;
    nav('member-'+id);S.tab=t;render();
  }
  else if(a==='back')nav('members');
  else if(a==='tile'){S.filter=el.dataset.f;S.q='';nav('members')}
  else if(a==='filter'){S.filter=el.dataset.f;render()}
  else if(a==='add-member')openMemberSheet(null);
  else if(a==='edit-member'&&mid)openMemberSheet(mid);
  else if(a==='add-pass'&&mid)openPassSheet(mid);
  else if(a==='new-log'&&mid)openLogSheet(mid,null);
  else if(a==='edit-log'&&mid)openLogSheet(mid,el.dataset.id);
  else if(a==='add-sched'&&mid)openSchedSheet(mid);
  else if(a==='sched-log'&&mid){const s=S.scheds[el.dataset.id];if(s)openLogSheet(mid,null,s.date)}
  else if(a==='del-sched'){
    if(S.confirm===el.dataset.id){S.confirm=null;del('sched',el.dataset.id);toast('일정을 삭제했어요')}
    else{S.confirm=el.dataset.id;render()}
  }
  else if(a==='pick-log')openPicker();
  else if(a==='sample')addSample();
  else if(a==='tab'){S.tab=el.dataset.t;S.confirm=null;render()}
  else if(a==='metric'){S.bodyMetric=el.dataset.k;render()}
  else if(a==='add-body'&&mid)openBodySheet(mid,null);
  else if(a==='edit-body'&&mid)openBodySheet(mid,el.dataset.id);
  else if(a==='scan-new'&&mid){openBodySheet(mid,null);$('#scan-file').click()}
  else if(a==='meal-load'){S.mealDate=el.dataset.date;render();window.scrollTo(0,0)}
  else if(a==='save-meal'&&mid){
    const date=S.mealDate||todayStr(),v=id=>(($('#'+id)||{}).value||'').trim();
    const rec={memberId:mid,date:date,b:v('meal-b'),l:v('meal-l'),d:v('meal-d'),s:v('meal-s'),w:v('meal-w'),c:v('meal-c')};
    const key='meal-'+mid+'-'+date;
    if(!(rec.b||rec.l||rec.d||rec.s||rec.w||rec.c)){
      if(S.meals[key]){del('meal',key);toast('식단 기록을 비웠어요')}else toast('내용을 입력해 주세요');
      return;
    }
    put('meal',key,rec);toast(fmtDate(date)+' 식단을 저장했어요');
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const l=$('#mlist');if(l)l.innerHTML=memberListHtml()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='meal-date'){S.mealDate=t.value||todayStr();t.blur();render()}
  else if(t.id==='scan-file'){
    const f=t.files&&t.files[0];t.value='';
    if(f&&R&&shHandler===bodyHandler&&SC.sample)runScan(f);
  }
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pendingRender&&!typing())render()},0)});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"]')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&!sh.hidden)closeSheet();
});
window.addEventListener('hashchange',()=>setRoute(location.hash));

setRoute(location.hash);
init();
})();
</script>
